openapi: 3.0.3
info:
  title: Cordia Integrated Health API
  version: 0.1.0
servers:
  - url: https://api.cordia.local
paths:
  /api/auth/login:
    post:
      summary: Staff login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/Staff'
  /api/patients:
    get:
      summary: List patients
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Patient list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'
    post:
      summary: Create patient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patient'
      responses:
        '201':
          description: Created patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
  /api/appointments:
    get:
      summary: List appointments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Appointment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
    post:
      summary: Create appointment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Appointment'
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
  /api/scribe/transcripts:
    post:
      summary: Generate SOAP note from transcript
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transcript'
      responses:
        '201':
          description: SOAP note pending review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoapNote'
  /api/scribe/notes/{id}/review:
    post:
      summary: Review SOAP note
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewerId:
                  type: string
                approved:
                  type: boolean
                feedback:
                  type: string
      responses:
        '200':
          description: Updated SOAP note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoapNote'
  /api/billing/invoices:
    get:
      summary: List invoices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invoice list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
    post:
      summary: Create pre-service estimate and invoice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appointmentId:
                  type: string
                patientId:
                  type: string
                services:
                  type: array
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                      amount:
                        type: number
      responses:
        '201':
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
  /api/dashboard:
    get:
      summary: RCM and workflow overview
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  metrics:
                    type: object
  /api/notifications/settings:
    get:
      summary: Reminder configuration
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reminder settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderSettings'
    put:
      summary: Update reminder settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderSettings'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderSettings'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    Patient:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
    Staff:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [ADMIN, STAFF, PATIENT]
    Appointment:
      type: object
      properties:
        id:
          type: string
        patientId:
          type: string
        providerId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
    Transcript:
      type: object
      required: [appointmentId, transcript]
      properties:
        appointmentId:
          type: string
        transcript:
          type: string
    SoapNote:
      type: object
      properties:
        id:
          type: string
        appointmentId:
          type: string
        status:
          type: string
          enum: [DRAFT, PENDING_REVIEW, APPROVED, REJECTED]
    Invoice:
      type: object
      properties:
        id:
          type: string
        patientId:
          type: string
        amount:
          type: number
        status:
          type: string
    ReminderSettings:
      type: object
      properties:
        cadenceDays:
          type: array
          items:
            type: number
        smsTemplate:
          type: string
        emailTemplate:
          type: string
