version: '3.9'
services:
  api:
    build: ../apps/api
    command: npm run dev
    volumes:
      - ../apps/api:/usr/src/app
      - ../packages:/usr/src/packages
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/cordia
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change-me
      - STRIPE_SECRET=sk_test_placeholder
      - STRIPE_WEBHOOK_SECRET=whsec_placeholder
      - TWILIO_ACCOUNT_SID=ACXXXX
      - TWILIO_AUTH_TOKEN=auth_token
      - TWILIO_FROM_NUMBER=+15555550000
      - SENDGRID_API_KEY=SG.xxxx
      - SENDGRID_FROM_EMAIL=notifications@cordia.test
    depends_on:
      - postgres
      - redis
  web:
    build: ../apps/web
    command: npm run dev -- --host 0.0.0.0 --port 3000
    volumes:
      - ../apps/web:/usr/src/app
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:4000
    depends_on:
      - api
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cordia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
volumes:
  postgres-data:
